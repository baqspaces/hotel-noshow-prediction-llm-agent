services:
  noshow-app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/noshow.db
      JWT_SECRET: change-this-before-production
      DEMO_USERNAME: manager
      DEMO_PASSWORD: password123
      # Current demo LLM configuration. Only OpenAI is implemented in code today.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      # Additional providers such as Claude or Gemini require provider-specific config and client code.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
